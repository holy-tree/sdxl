[project]
name = "sdxl-weather-controlnet"
version = "0.1.0"
description = "SDXL + ControlNet for weather-restoration (rain / snow / haze)"
requires-python = ">=3.10"

dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "diffusers>=0.35.0",
    "transformers>=4.50.0",
    "accelerate>=1.0.0",
    "huggingface-hub>=0.25.0",
    "Pillow>=9.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "opencv-python>=4.8.0",
    "packaging>=23.0",
    "safetensors>=0.4.0",
    "tokenizers>=0.20.0",
    "requests>=2.31.0",
    "filelock>=3.12.0",
    "regex>=2023.0.0",
]


[project.optional-dependencies]

train = [
    "bitsandbytes>=0.43.0",
    "xformers==0.0.32.post2",
]

tracking = [
    "tensorboard>=2.14.0",
    "wandb>=0.15.0",
]

dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]


[project.urls]
homepage = "https://huggingface.co/diffusers"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = [
    "dataloaders",
    "utils",
]


[project.scripts]
sdxl_train = "train:main"
sdxl_test = "test:main"



# ===============================
# uv CUDA wheel sources
# ===============================


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"



# 强制 torch / torchvision 使用 CUDA 12.6 wheel

[tool.uv.sources]

torch = { index = "pytorch-cu126" }

torchvision = { index = "pytorch-cu126" }