# =====================================================================
# SDXL + ControlNet 推理/可视化配置 (雨/雪/雾恶劣天气恢复)
# =====================================================================
# 用法:
#   python test.py --config configs/test.yaml
#   python test.py --lq_dir path/to/lq --gt_dir path/to/gt --controlnet_path ./out
# =====================================================================

# ---------- 模型路径 ----------
pretrained_model_name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
pretrained_vae_model_name_or_path: null
controlnet_path: "/root/autodl-tmp/sdxl/experiment/weather_controlnet/checkpoint-18000/controlnet"
variant: null                     # null | fp16 | bf16
revision: null

# ---------- 输入 / 输出 ----------
test_dataset_root: "/root/autodl-tmp/datasets_test"  # 自动读取 rain/snow/haze 下所有子集gt/lq
num_samples_per_weather: 50       # 每个天气评估多少张图
num_save_per_weather: 10          # 每个天气保存多少张图（restored + compare）
lq_dir: null                      # 旧模式（单目录）, 与 test_dataset_root 二选一
gt_dir: null                      # 旧模式（单目录）, 与 test_dataset_root 二选一
output_dir: "/root/autodl-tmp/sdxl/experiment/test_results"
file_extension: ".jpg"            # 输入图扩展名
limit: 3                          # 最多处理多少张图, null = 全部（仅旧模式有效）

# ---------- 推理参数 ----------
resolution: 512
mixed_precision: "bf16"           # fp32 | fp16 | bf16
num_inference_steps: 20
guidance_scale: 5.0
controlnet_conditioning_scale: 1.0
seed: 42
sample_times: 1

# ---------- Prompt (默认全部空, 纯 ControlNet 条件恢复) ----------
prompt: ""
negative_prompt: "dotted, noise, blur, lowres, smooth"
weather_prompts:
  rain: "rainy scene, rain streaks on the image, wet surfaces, overcast sky"
  snow: "snowy scene, snowflakes covering the image, cold atmosphere, white noise"
  haze: "hazy scene, foggy atmosphere, low visibility, grayish tone"
auto_weather_prompt: false        # true: 根据文件名 weather_xxx.png 自动选 prompt

# ---------- 后处理 ----------
conditioning_type: "lq"           # lq | gray | canny
align_method: "adain"             # none | wavelet | adain (默认 adain 兜底色差: 把 PRED RGB 通道均值/方差对齐到 LQ)
save_individual: true             # 单独保存恢复结果
save_comparison: true             # 保存 LQ | Restored | GT 三联图

# ---------- 加速 ----------
attention_backend: "auto"
enable_xformers_memory_efficient_attention: true
enable_model_cpu_offload: false

# ---------- 报告 ----------
print_model_info: true
print_color_stats: true
