# =====================================================================
# SDXL + ControlNet 训练配置 (雨/雪/雾等恶劣天气图像恢复)
# =====================================================================
# 用法:
#   python train.py --config configs/train.yaml
#
# 训练时只更新 ControlNet 权重, SDXL 的 UNet/VAE/Text Encoder 全部冻结.
# 数据集目录结构:
#   <dataset_root>/<weather>/<split>/{GT,LQ}/<image>.png
#   weather ∈ {rain, snow, haze, ...}, split ∈ {train, val, test}
# =====================================================================

# ---------- 路径 ----------
pretrained_model_name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
pretrained_vae_model_name_or_path: null
controlnet_model_name_or_path: null
revision: null                    # 模型仓库版本 (branch/tag/sha)
variant: null                     # 模型权重变体 (如 "fp16" / "bf16")
output_dir: "/root/autodl-tmp/sdxl/experiment/weather_controlnet"
resume_from_checkpoint: "checkpoint-18000"

# ---------- 数据 ----------
dataset_root: "/root/autodl-tmp/datasets"
weather_types: ["rain", "snow", "haze"]
splits: ["train"]
resolution: 512
conditioning_type: "lq"            # lq | gray | canny

# 按天气类型限制训练样本数, <=0 或缺省 = 不限制
weather_num_samples:
  rain: -1
  snow: -1
  haze: -1

# ---------- Prompt / CFG ----------
use_prompt: false
prompt_ratio: 0.2
proportion_empty_prompts: 0.0
null_text_ratio: 0.5
weather_prompts:
  rain: "rainy scene, rain streaks on the image, wet surfaces, overcast sky"
  snow: "snowy scene, snowflakes covering the image, cold atmosphere, white noise"
  haze: "hazy scene, foggy atmosphere, low visibility, grayish tone"
  fog:  "foggy scene, low visibility, soft white veil over the landscape"
  frost: "frosted scene, icy texture, frozen edges, cold blue tone"

# ---------- 训练超参数 ----------
learning_rate: 2.0e-6                # 继续训练用更小 LR 校准 ControlNet 残差幅度
train_batch_size: 16
gradient_accumulation_steps: 1
num_train_epochs: 2                  # 接着训 2 个 epoch 就够
max_train_steps: 3000                # 上限 3000 步, 防过度
seed: 42
mixed_precision: "bf16"
gradient_checkpointing: false
use_8bit_adam: false
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.01
adam_epsilon: 1.0e-08
max_grad_norm: 1.0
set_grads_to_none: true
scale_lr: false
l1_weight: 0.5
pixel_l1_weight: 1.0                # 像素空间 L1 (对齐 GT 亮度), 1.0 起手, 视效果调
pixel_l1_every_n_steps: 5           # VAE decode 开销大, 每 5 步算一次像素 L1

# ---------- 学习率调度 ----------
lr_scheduler: "cosine"
lr_warmup_steps: 500
lr_num_cycles: 0.5
lr_power: 1.0

# ---------- DataLoader ----------
dataloader_num_workers: 8
dataloader_prefetch_factor: 4
pin_memory: true
pin_memory_device: "cuda"        # null | "cuda" | "xpu"
persistent_workers: true
non_blocking_transfer: true
image_interpolation_mode: "bilinear"   # bilinear (推荐, 接近 controlnet_file 速度) | bicubic | lanczos (质量更好但慢)
augment: true
channels_last: true             # image tensor NHWC layout
preload_dataset: false          # true 时把所有图像预解码到内存 (小数据集)

# ---------- 磁盘预处理缓存 (opt-in) ----------
# 默认关闭 (与 controlnet_file/dataloaders/paired_dataset.py 一致, 靠 num_workers + SSD)
# 开启后首次运行: open + resize + center_crop + (canny/gray) 跑一遍, 存到 cache_dir
# 后续 epoch: 直接读缓存, 跳过 PIL/decode/resize/canny, 单 sample 几 ms
# 1024² 单张磁盘占用: .pt ≈ 3MB, PNG ≈ 1-3MB, JPEG q95 ≈ 0.3-1MB (推荐)
cache_dir: null                          # 留空 = 不缓存 (默认)
cache_format: "jpg"                     # "jpg" (5x 节省) | "pt" (无解码) | "png"
cache_jpeg_quality: 95                  # 仅 jpg 生效, 90-97 之间
force_rebuild_cache: false
cache_num_workers: 0                     # 0=单进程; >0 启用多进程构建

# ---------- SDXL crop coordinates ----------
crops_coords_top_left_h: 0
crops_coords_top_left_w: 0

# ---------- 优化 / 加速 ----------
#   attention_backend: "auto" → xformers (启用时) → SDPA flash → SDPA mem-eff → math
#                    "xformers" 仅用 xformers; "sdpa" 仅用 PyTorch 原生 SDP; "math" 关闭加速
attention_backend: "auto"
enable_xformers_memory_efficient_attention: true
enable_npu_flash_attention: false
allow_tf32: false
torch_compile: false            # torch.compile(unet, controlnet) — 首次启动慢
torch_compile_mode: "reduce-overhead"

# ---------- Checkpointing ----------
checkpointing_steps: 1000
checkpoints_total_limit: 3

# ---------- 日志 ----------
logging_dir: "logs"
report_to: "tensorboard"
tracker_project_name: "sdxl_weather_controlnet"
push_to_hub: false
hub_token: null
hub_model_id: null

# ---------- 验证 (in-training inference) ----------
# 验证集从 <dataset_root>/<weather>/test/LQ 自动发现, 每个天气选 num_validation_images 张.
#   例: num_validation_images=2, weather_types=[rain, snow, haze]  -> 每 1000 步共 6 张验证图
#   每张 LQ 生成 1 张 pred.
# 如需手动指定, 把 validation_image 设为单路径或路径列表即可覆盖自动选择
run_validation: true
validation_steps: 1000
num_validation_images: 3          # 每个天气验证时取的 LQ 数量, 每张 LQ 生成 1 张 pred
#validation_image: null            # 单张 LQ 路径 / 列表 / null (= 自动)
validation_prompt: ""             # 与 validation_image 一一对应, 默认空
validation_guidance_scale: 5.0
validation_inference_steps: 20
validation_negative_prompt: "dotted, noise, blur, lowres, smooth"
